[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orisan-mcpscan"
version = "0.2.0"
description = "Local-first security scanner for Model Context Protocol servers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rakesh" }]
keywords = ["mcp", "security", "scanner", "model-context-protocol", "appsec"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  # Upper bound is load-bearing, not caution. mcp 2.0 renamed streamablehttp_client
  # to streamable_http_client and removed mcp.server.fastmcp with no aliases, which
  # kills remote scanning. See BRIEF-0.1.1.md bug 3 and src/mcpscan/sdk_compat.py.
  # Adapting to the 2.0 API is slice F; do not widen this pin before it lands.
  "mcp[cli]>=1.0.0,<2",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0.0",
  "httpx>=0.27.0",
  # Ed25519 for signed scan results. The first crypto dependency here;
  # signing is opt-in and a scan without a key still runs.
  "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "jsonschema>=4.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0"
]

[project.scripts]
mcpscan = "mcpscan.cli:app"
orisan-mcpscan = "mcpscan.cli:app"

[project.urls]
Homepage = "https://github.com/Orisan-org/mcpscan"
Repository = "https://github.com/Orisan-org/mcpscan"
Issues = "https://github.com/Orisan-org/mcpscan/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpscan"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP042", "SIM117"]

[tool.pytest.ini_options]
addopts = "-m 'not network and not wheel'"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "network: tests that require external package downloads or network access",
  "wheel: tests that build the wheel and install it into a clean venv (slow, needs PyPI). Run with `pytest -m wheel`; gated in CI by the wheel-harness job.",
]
