# mcp 2.x READINESS CANARY — advisory, non-blocking, and EXPECTED TO FAIL.
#
# This job is an instrument, not a gate. It runs slice A's wheel harness against an
# mcp 2.x resolution and reports what happens. Today it fails, because slice D pinned
# `mcp[cli]<2` and slice F — the actual port to the 2.0 API — is not done. mcpscan's
# own SDK guard refuses to scan there, which is correct behaviour and a failing canary.
#
# Its entire purpose is to tell us THE DAY IT STARTS PASSING. A red canary is the
# expected state and carries no obligation. A green canary is news: it means the 2.x
# surface has become compatible and slice F can proceed, or has landed and works.
#
# ┌────────────────────────────────────────────────────────────────────────────────┐
# │ DO NOT "FIX" THIS JOB BY MAKING IT GREEN.                                      │
# │                                                                                │
# │ Constraining the spec below 2, marking tests xfail, or narrowing what runs      │
# │ turns the instrument off while leaving something that looks like coverage.      │
# │ That is strictly worse than deleting the file, because it lies.                 │
# │                                                                                │
# │ If this job is noisy, change its schedule. If it is wrong, delete it and say    │
# │ so in the PR. Do not pin it into the green.                                     │
# │                                                                                │
# │ tests/test_readiness_canary_is_not_pinned.py enforces this.                    │
# └────────────────────────────────────────────────────────────────────────────────┘
#
# It is deliberately NOT in ci.yml: nothing here should ever block a merge.
name: mcp 2.x readiness canary

on:
  schedule:
    # 07:00 UTC Mondays, an hour after the wheel canary, so a shared PyPI outage is
    # visible as two separate signals rather than one confusing combined failure.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  mcp2-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Run the wheel harness against mcp 2.x
        id: probe
        continue-on-error: true
        env:
          # Unbounded on purpose. Whatever 2.x resolves to today is the thing we want
          # to know about. See the box above before editing this line.
          MCPSCAN_WHEEL_MCP_SPEC: "mcp[cli]>=2"
          UV_NO_CACHE: "1"
        run: pytest -m wheel -v

      - name: Report readiness
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.probe.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "mcp 2.x readiness canary is GREEN - slice F is unblocked"
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "failure" ]; then
            {
              echo "### mcp 2.x readiness: NOT READY"
              echo
              echo "Expected. \`mcp[cli]<2\` is pinned and slice F is not done."
              echo "No action required. This job does not gate anything."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### mcp 2.x readiness: GREEN"
            echo
            echo "The built wheel passed the full harness against an mcp 2.x resolution."
            echo "Slice F can proceed, or has landed. Widen the pin in pyproject.toml and"
            echo "the bounds in src/mcpscan/sdk_compat.py together — never one without the other."
          } >> "$GITHUB_STEP_SUMMARY"

          existing="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [ -n "$existing" ]; then
            exit 0
          fi
          {
            printf 'The mcp 2.x readiness canary passed. The built wheel now works against an\n'
            printf 'mcp 2.x resolution.\n\n'
            printf 'Run: %s\n\n' "$RUN_URL"
            printf 'This is a signal, not a completed task. Slice F still has to widen the pin in\n'
            printf 'pyproject.toml and the bounds in src/mcpscan/sdk_compat.py together, and give\n'
            printf 'the harness a second wheel environment so both resolutions stay covered.\n'
          } > issue-body.md
          gh issue create --title "$TITLE" --body-file issue-body.md
